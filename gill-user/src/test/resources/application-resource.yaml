spring:
  application:
    name: test-user
  sql:
    init:
      schema-locations:
        - classpath:init/schema.sql
      data-locations:
        - classpath:init/data.sql

redis:
  nodes:
    - localhost:19000
  database: 1
  password: 123456

datasources:
  sources:
    db:
      is-primary: true
      url: jdbc:h2:mem:test2
      username: sa
      password:
      driver-class-name: org.h2.Driver

interceptor:
  csrf: false

dubbo:
  registry:
    address: zookeeper://127.0.0.1:2181
  application:
    qos-enable: false